<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ff6b9d" />
<title>测测你和你担的肌肤饥渴</title>
<style>
  :root {
    --ink: #3b2c42;
    --ink-soft: #7a6b82;
    --pink: #ff6b9d;
    --pink-deep: #f44f86;
    --violet: #a97fe8;
    --card: rgba(255, 255, 255, .9);
    --line: rgba(180, 140, 200, .22);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 620px at 12% -8%, #ffd9e7 0%, rgba(255,217,231,0) 55%),
      radial-gradient(820px 600px at 108% 4%, #e6dcff 0%, rgba(230,220,255,0) 52%),
      radial-gradient(720px 520px at 50% 110%, #d7ecff 0%, rgba(215,236,255,0) 55%),
      linear-gradient(180deg, #fff0f5 0%, #f5ecff 50%, #eef3ff 100%);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 26px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* 漂浮的心 / 星星 */
  .float {
    position: fixed; pointer-events: none; z-index: 0;
    font-size: 18px; opacity: .34;
    animation: floaty 9s ease-in-out infinite;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-26px) rotate(8deg); }
  }

  .stage { position: relative; width: 100%; max-width: 420px; margin: auto; z-index: 1; }

  /* 顶部徽章 */
  .badge-float {
    position: absolute; top: -16px; right: 8px; z-index: 3;
    background: linear-gradient(135deg, #ff7eb3, #a97fe8);
    color: #fff; padding: 8px 13px; border-radius: 30px;
    font-size: 13px; letter-spacing: 1px; font-weight: 700;
    box-shadow: 0 6px 18px rgba(244,79,134,.35);
    transform: rotate(4deg);
    display: flex; align-items: center; gap: 5px;
  }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 24px;
    box-shadow: 0 22px 55px rgba(120, 90, 160, .18), 0 2px 10px rgba(120,90,160,.06);
    padding: 32px 22px 26px;
    overflow: hidden;
    backdrop-filter: blur(8px);
  }

  /* ============ 标题页 ============ */
  .hero { text-align: center; padding-top: 6px; }
  .hero .kicker {
    font-size: 12px; letter-spacing: 4px; color: var(--violet);
    margin-bottom: 14px; font-weight: 600;
  }
  .hero h1 {
    font-size: 27px; line-height: 1.4; font-weight: 800; letter-spacing: 1px;
  }
  .hero h1 .hl {
    background: linear-gradient(120deg, var(--pink), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .sub {
    margin-top: 14px; font-size: 14px; color: var(--ink-soft); line-height: 1.9; letter-spacing: .5px;
  }
  .hero .emoji-row { margin: 18px 0 4px; font-size: 26px; letter-spacing: 8px; }

  .divider {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin: 22px 0; color: var(--pink);
  }
  .divider::before, .divider::after {
    content: ""; height: 1.5px; width: 64px;
    background: linear-gradient(90deg, transparent, var(--pink));
  }
  .divider::after { background: linear-gradient(90deg, var(--pink), transparent); }
  .divider .heart { font-size: 14px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; cursor: pointer; border: none; font-family: inherit;
    background: linear-gradient(135deg, #ff7eb3 0%, #f44f86 100%);
    color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 2px;
    padding: 16px 0; width: 100%; border-radius: 40px;
    box-shadow: 0 12px 26px rgba(244,79,134,.4), inset 0 1px 0 rgba(255,255,255,.3);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:active { transform: translateY(1px) scale(.985); box-shadow: 0 5px 14px rgba(244,79,134,.35); }
  .btn.ghost {
    background: #fff; color: var(--pink-deep);
    border: 1.5px solid var(--pink); box-shadow: none; letter-spacing: 1px;
  }
  .hero .tips { margin-top: 18px; font-size: 12px; color: #b39ec0; letter-spacing: 1px; }

  /* ============ 题目页 ============ */
  .quiz-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .quiz-head .num { font-size: 13px; color: var(--pink-deep); letter-spacing: 1px; font-weight: 700; }
  .quiz-head .back { font-size: 13px; color: var(--ink-soft); cursor: pointer; padding: 4px 6px; }
  .progress {
    height: 6px; border-radius: 4px; background: rgba(244,79,134,.14);
    overflow: hidden; margin-bottom: 24px;
  }
  .progress i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--pink), var(--violet));
    border-radius: 4px; transition: width .4s cubic-bezier(.4,0,.2,1);
  }

  .q-scene {
    font-size: 13px; line-height: 1.7; color: var(--ink-soft);
    background: linear-gradient(135deg, #fff5fb, #f6f0ff);
    border: 1px dashed rgba(180,140,200,.4);
    border-radius: 12px; padding: 11px 14px; margin-bottom: 16px;
    letter-spacing: .3px;
  }
  .q-scene b { color: var(--pink-deep); font-weight: 700; }
  .q-title {
    font-size: 19px; line-height: 1.55; font-weight: 800; letter-spacing: .5px;
    margin-bottom: 18px; color: var(--ink);
  }
  .q-title .q-no { color: var(--pink-deep); margin-right: 5px; }

  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    position: relative; display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1.5px solid rgba(180,140,200,.2);
    border-radius: 16px; padding: 14px 15px; cursor: pointer;
    transition: all .22s ease; box-shadow: 0 2px 8px rgba(120,90,160,.06);
  }
  .opt .tag {
    flex: none; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: #f6f0ff; color: var(--violet); font-size: 13px; font-weight: 700;
    transition: all .22s ease;
  }
  .opt .txt { font-size: 14.5px; line-height: 1.55; letter-spacing: .3px; color: #4a3b50; }
  .opt:active { transform: scale(.985); }
  .opt.pick {
    background: linear-gradient(135deg, #fff0f7 0%, #f4ecff 100%);
    border-color: var(--pink);
    box-shadow: 0 8px 18px rgba(244,79,134,.22);
  }
  .opt.pick .tag { background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; }

  /* ============ 结果页 ============ */
  .result { text-align: center; }
  .result .r-kicker {
    font-size: 12px; letter-spacing: 4px; color: var(--violet); margin-bottom: 8px; font-weight: 600;
  }
  .result .r-name {
    font-size: 27px; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; line-height: 1.35;
  }
  .result .r-tag {
    display: inline-block; font-size: 13.5px; color: var(--pink-deep); font-weight: 700;
    margin-bottom: 18px; letter-spacing: 1px;
  }

  /* 结果海报卡片 */
  .poster {
    position: relative; border-radius: 22px; padding: 30px 22px 28px;
    color: #fff; text-align: center; overflow: hidden;
    box-shadow: 0 18px 44px rgba(60,40,80,.3); margin-bottom: 22px; isolation: isolate;
  }
  .poster::before {
    content: ""; position: absolute; inset: 10px; border: 1.5px solid rgba(255,255,255,.35);
    border-radius: 14px; pointer-events: none; z-index: 1;
  }
  .poster .p-glow {
    position: absolute; top: -50px; right: -40px; width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, rgba(255,255,255,.5), rgba(255,255,255,.06) 62%, transparent 70%);
    z-index: 0;
  }
  .poster > * { position: relative; z-index: 2; }
  .poster .p-emoji { font-size: 42px; margin-bottom: 10px; }
  .poster .p-title { font-size: 28px; font-weight: 800; letter-spacing: 2px; margin-bottom: 6px; line-height: 1.3; }
  .poster .p-tag { font-size: 14px; letter-spacing: 1px; opacity: .95; margin-bottom: 16px; }
  .poster .p-line { width: 44px; height: 2px; margin: 0 auto 16px; background: rgba(255,255,255,.6); }
  .poster .p-kw { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-bottom: 16px; }
  .poster .p-kw span {
    font-size: 12px; letter-spacing: 1px; padding: 5px 12px; border-radius: 20px;
    background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.35);
  }
  .poster .p-text {
    font-size: 14.5px; line-height: 1.95; letter-spacing: .5px; opacity: .97;
    text-align: justify; text-align-last: center;
    background: rgba(0,0,0,.14); border-radius: 14px; padding: 16px 14px;
  }
  .poster .p-foot { margin-top: 16px; font-size: 11px; letter-spacing: 3px; opacity: .8; }

  /* CP 详说 */
  .r-detail { text-align: left; margin-bottom: 20px; }
  .r-detail .k { text-align: center; font-size: 12px; letter-spacing: 5px; color: var(--violet); margin-bottom: 10px; font-weight: 600; }
  .r-detail .t {
    font-size: 14.5px; line-height: 2; color: #5a4a63; letter-spacing: .4px;
    background: #fff; border: 1px solid rgba(180,140,200,.2);
    border-radius: 14px; padding: 15px 16px; text-align: justify;
  }
  .r-detail .t b { color: var(--pink-deep); font-weight: 700; }

  /* 其他 CP */
  .others { text-align: left; margin-bottom: 20px; }
  .others .k { text-align: center; font-size: 12px; letter-spacing: 5px; color: var(--violet); margin-bottom: 12px; font-weight: 600; }
  .others .ot-item {
    background: #fff; border: 1px solid rgba(180,140,200,.18);
    border-radius: 14px; padding: 13px 15px; margin-bottom: 10px;
  }
  .others .ot-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .others .ot-emoji { font-size: 20px; }
  .others .ot-name { font-size: 15px; font-weight: 800; color: var(--ink); letter-spacing: .5px; }
  .others .ot-tag { font-size: 12px; color: var(--pink-deep); margin-left: auto; font-weight: 600; white-space: nowrap; }
  .others .ot-text { font-size: 13px; line-height: 1.8; color: #7a6b82; letter-spacing: .3px; }

  /* 选择回顾 */
  .review { text-align: left; margin-bottom: 20px; }
  .review .k { text-align: center; font-size: 12px; letter-spacing: 5px; color: var(--violet); margin-bottom: 6px; font-weight: 600; }
  .review .rv-synth {
    background: linear-gradient(135deg, #fff5fb, #f6f0ff);
    border: 1px solid rgba(180,140,200,.3); border-radius: 12px;
    padding: 13px 15px; margin-bottom: 12px;
    font-size: 13.5px; line-height: 1.85; color: #5a4a63; letter-spacing: .3px;
  }
  .review .rv-synth b { color: var(--pink-deep); font-weight: 700; }
  .review-item {
    background: #fff; border: 1px solid rgba(180,140,200,.2);
    border-radius: 12px; margin-bottom: 9px; overflow: hidden;
  }
  .review-item .ri-q { display: flex; align-items: center; gap: 10px; padding: 11px 13px; cursor: pointer; }
  .review-item .ri-no {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; font-size: 12px;
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .review-item .ri-title { flex: 1; font-size: 13px; line-height: 1.4; color: var(--ink); letter-spacing: .3px; }
  .review-item .ri-arrow { flex: none; color: var(--violet); font-size: 13px; transition: transform .2s ease; }
  .review-item.open .ri-arrow { transform: rotate(90deg); }
  .review-item .ri-body { display: none; padding: 2px 13px 12px 44px; }
  .review-item.open .ri-body { display: block; }
  .review-item .ri-opt { font-size: 12.5px; color: var(--ink-soft); letter-spacing: .3px; line-height: 1.6; }
  .review-item .ri-opt b { color: var(--pink-deep); font-weight: 700; }

  .result-actions { display: flex; flex-direction: column; gap: 12px; }
  .result-actions .row { display: flex; gap: 12px; }
  .result-actions .row .btn { flex: 1; }

  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
    background: rgba(59,44,66,.94); color: #fff; padding: 11px 22px; border-radius: 30px;
    font-size: 14px; letter-spacing: 1px; opacity: 0; pointer-events: none;
    transition: all .3s ease; z-index: 99; box-shadow: 0 8px 24px rgba(0,0,0,.3);
    max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hidden { display: none !important; }
  .fade-in { animation: fadeUp .5s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="stage">
    <div class="badge-float">💕 肌肤饥渴</div>

    <!-- 标题页 -->
    <div class="card" id="screen-start">
      <div class="hero">
        <div class="kicker">— 肌肤饥渴 · 黏法小测 —</div>
        <h1>测测你和你担的<br><span class="hl">肌肤饥渴</span>是哪一款</h1>
        <div class="emoji-row">🐱 🐨 🐺 🦔</div>
        <div class="divider"><span class="heart">💗</span></div>
        <p class="sub">八道题，代入那个和他在一起的人<br>看看你俩黏的是荷尔蒙、体温、主权，还是疼痛</p>
        <button class="btn" id="btn-start">开始测试</button>
        <div class="tips">纯属娱乐 · 别太当真（嗑到了就行）</div>
      </div>
    </div>

    <!-- 题目页 -->
    <div class="card hidden" id="screen-quiz">
      <div class="quiz-head">
        <span class="back" id="btn-back">‹ 上一题</span>
        <span class="num" id="q-num">1 / 8</span>
      </div>
      <div class="progress"><i id="progress-bar"></i></div>
      <div class="q-scene" id="q-scene"></div>
      <div class="q-title" id="q-title"></div>
      <div class="opts" id="q-opts"></div>
    </div>

    <!-- 结果页 -->
    <div class="card hidden" id="screen-result">
      <div class="result">
        <div class="r-kicker" id="r-kicker">你的肌肤饥渴型</div>
        <div class="r-name" id="r-name"></div>
        <div class="r-tag" id="r-tag"></div>
        <div class="poster" id="poster"></div>

        <div class="r-detail">
          <div class="k">— 你们的黏法详说 —</div>
          <div class="t" id="r-detail"></div>
        </div>

        <div class="review">
          <div class="k">— 你的肌肤饥渴取向分析 —</div>
          <div class="rv-synth" id="rv-synth"></div>
          <div class="review-list" id="review-list"></div>
        </div>

        <div class="others">
          <div class="k">— 其他肌肤饥渴类型 —</div>
          <div class="ot-list" id="ot-list"></div>
        </div>

        <div class="result-actions">
          <button class="btn" id="btn-save">💾 保存 / 分享结果海报</button>
          <div class="row">
            <button class="btn ghost" id="btn-retest">再测一次</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* ============ 数据 ============ */
var IDS = ["zhiqiu", "xineng", "badao", "gongdan"];

var RESULTS = {
  "zhiqiu": {
    name: "动物本能 · 纯欲直球派",
    tag: "馋你身子 · 荷尔蒙永动机",
    emoji: "🐱",
    c1: "#e0556b", c2: "#ff8ba0",
    kw: ["生理性吸引", "直球", "叠叠乐", "亲亲怪", "性张力"],
    text: "你俩的爱，甜在荷尔蒙里。接吻像呼吸一样随便，沙发上躺躺就变「叠叠乐」，睡觉必须肉贴肉——你比他还熟悉自己哪块怕痒。",
    detail: "你俩的感情，是标准的「动物本能」。不玩欲擒故纵那套——出门前亲、进门后亲、做饭时从背后亲脖子、打游戏暂停也要扭头亲一下。在家基本处于「半裸奔」状态，穿彼此的衣服当家居服；沙发上躺躺就变成「叠叠乐」，一个人趴另一个人身上刷手机，谁也不嫌重；晚上哪怕热出一身汗也要扒着睡，推开五分钟又粘回来。你们的亲密感来自「我对你的身体比我自己还熟」——知道他哪个地方怕痒、呼吸变重代表什么。他洗完澡出来头发滴水，你直接拽过来用毛巾搓，搓着搓着就笑成一团。连操心都特别「肉欲」：督促他健身，因为「你腰窝练出来我更喜欢」。人前想亲不能亲时，就从背后走过去，手心贴一下他后颈——「先存着，回家还。」"
  },
  "xineng": {
    name: "静默寄生 · 无声吸能派",
    tag: "人形充电宝 · 贴贴就续命",
    emoji: "🐨",
    c1: "#2f8f86", c2: "#6fc6bd",
    kw: ["各干各的", "脚叠着", "充电", "不索取", "老夫老妻"],
    text: "你俩的爱，安静得像充上了电。各干各的，脚在被子底下叠着；不索取、不热烈，但只要贴着，你就有能量把这一天过下去。",
    detail: "你俩的感情，是标准的「静默寄生」。家里很安静，但两个人永远在半径一米之内——一个看纸质书，一个打游戏，脚必须叠在一起；沙发上各歪一头，脚在中间交叉。最经典的画面：一个人在赶工，另一个人默默把椅子滑到旁边，脑袋靠上大腿，不说话、玩手机，偶尔把屏幕歪过去给对方看个好笑的东西，对方瞥一眼笑一下，继续干活。没有热烈的亲吻，但早上醒来迷迷糊糊时，一个人会把脸埋进另一个人后颈的头发里，深深吸一口气再继续睡。你们的亲密不是「我要你」，是「你在这里，我就有能量」。操心全在无缝衔接的细节里：浴巾永远搭在门把手上，水杯空了总有人倒满。最暧昧的暗号是「后脑勺蹭肩窝」——谁先把后脑勺塞进对方的锁骨窝，谁就是今晚先说「我爱你」的那个。"
  },
  "badao": {
    name: "盖章宣示 · 霸道占有派",
    tag: "霸道总裁爱上我 · 盖章cp",
    emoji: "🐺",
    c1: "#5b3f9e", c2: "#9a7fd6",
    kw: ["宣示主权", "盖章", "十指紧扣", "圈养", "我的"],
    text: "你俩的爱，靠「你是我的」反复确认。走路十指扣紧，人前宣示主权，睡前一道工序从背后圈住——「嗯，今天也是我的。」",
    detail: "你俩的感情，是标准的「盖章宣示」。走路不是牵手，是十指交叉扣紧，拇指还在对方手背上反复摩挲。人前的小动作极多：说话时手搭后腰、下巴压在对方肩胛骨上、对方跟别人说话时从背后捏一下后颈；合照一定有一张从背后环抱、下巴搁头顶，眼神看镜头——「看见没，我的。」你们的亲密靠「用肢体说所有权」：每天睡前有一道固定工序，从背后搂住、收紧手臂、下巴搁进肩窝、深呼吸一次，说一句「嗯，今天也是我的。」操心全在掌控感上：手机密码必须知道（不是查岗，是「我应该知道」）；衣服穿少了，追出去把人拽回来套外套。最暧昧的暗号是「掐虎口」——人前想宣示又不好意思，走过去捏一下虎口，用力、停两秒、松开，意思是「我在看着你」。"
  },
  "gongdan": {
    name: "病友相护 · 疼痛共担派",
    tag: "互为人形止痛药 · 共担cp",
    emoji: "🦔",

var cur = 0;

var $ = function(id){ return document.getElementById(id); };
var screens = {
  start:  $("screen-start"),
  quiz:   $("screen-quiz"),
  result: $("screen-result")
};
var TOAST_TIMER = null;

function show(name){
  for (var k in screens) screens[k].classList.add("hidden");
  screens[name].classList.remove("hidden");
  screens[name].classList.remove("fade-in");
  void screens[name].offsetWidth;
  screens[name].classList.add("fade-in");
}
function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(function(){ t.classList.remove("show"); }, 2400);
}

/* ============ 题目渲染 ============ */
var LBL = ["A","B","C","D"];

function renderQuestion(){
  var q = QUESTIONS[cur];
  $("q-num").textContent = (cur+1) + " / " + QUESTIONS.length;
  $("progress-bar").style.width = ((cur+1)/QUESTIONS.length*100) + "%";
  $("q-scene").innerHTML = '📌 <b>场景</b>　' + q.scene;
  $("q-title").innerHTML = '<span class="q-no">' + (cur+1) + '.</span>' + q.q;
  var box = $("q-opts");
  box.innerHTML = "";
  q.opts.forEach(function(o, i){
    var div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = '<span class="tag">' + LBL[i] + '</span><span class="txt">' + o.t + '</span>';
    div.addEventListener("click", function(){ pick(div, o); });
    box.appendChild(div);
  });
}

function pick(el, o){
  if (el.classList.contains("pick")) return;
  el.classList.add("pick");
  answers[cur] = { q: QUESTIONS[cur].q, opt: o };
  setTimeout(function(){
    if (cur < QUESTIONS.length - 1){ cur++; renderQuestion(); }
    else { finish(); }
  }, 260);
}

/* ============ 结果计算 ============ */
function computeResultInner(){
  var tally = {};
  answers.forEach(function(a){
    if (!a) return;
    var w = a.opt.w || {};
    for (var k in w) tally[k] = (tally[k] || 0) + w[k];
  });
  var best = null, bestScore = -1, ties = [];
  IDS.forEach(function(id){
    var s = tally[id] || 0;
    if (s > bestScore){ bestScore = s; best = id; ties = [id]; }
    else if (s === bestScore){ ties.push(id); }
  });
  return RESULTS[ties[Math.floor(Math.random() * ties.length)]];
}

function finish(){
  var r = computeResultInner();
  currentResult = r;
  $("r-name").textContent = r.name;
  $("r-tag").textContent = r.tag;
  $("r-detail").textContent = r.detail;
  renderPosterHTML(r);
  renderReview();
  renderOthers();
  show("result");
  window.scrollTo(0, 0);
}

/* ============ 肌肤饥渴取向分析 + 回顾 ============ */
function renderReview(){
  var synth = $("rv-synth");
  var list = $("review-list");
  list.innerHTML = "";

  var dist = {};
  answers.forEach(function(a){
    if (!a) return;
    var w = a.opt.w || {};
    var best = null, bs = 0;
    for (var k in w){ if (w[k] > bs){ bs = w[k]; best = k; } }
    dist[best] = (dist[best] || 0) + 1;
  });
  var order = Object.keys(dist).sort(function(x, y){ return dist[y] - dist[x]; });
  var top = order[0];
  var topName = RESULTS[top] ? RESULTS[top].name : "";
  var myName = currentResult.name;

  var body;
  if (RESULTS[top] === currentResult){
    body = '你的「肌肤饥渴」取向很一致——8 道题里大多都指向「' + myName + '」这一挂，从初识到相处黏得很彻底，不是随便测出来的。';
  } else {
    body = '你的选择有散有聚，但总体上最贴近「' + topName + '」，最后却收束成了「' + myName + '」——说明你在「黏」这件事上，藏着自己都未必察觉的一面。';
  }
  synth.innerHTML = '<b>【肌肤饥渴取向】</b>' + body;

  answers.forEach(function(a, i){
    if (!a) return;
    var item = document.createElement("div");
    item.className = "review-item";
    item.innerHTML =
      '<div class="ri-q">' +
        '<span class="ri-no">' + (i + 1) + '</span>' +
        '<span class="ri-title">' + a.q + '</span>' +
        '<span class="ri-arrow">▸</span>' +
      '</div>' +
      '<div class="ri-body">' +
        '<div class="ri-opt">你选了：<b>' + a.opt.t + '</b></div>' +
      '</div>';
    item.querySelector(".ri-q").addEventListener("click", function(){
      item.classList.toggle("open");
    });
    list.appendChild(item);
  });
}

function renderOthers(){
  var box = $("ot-list");
  box.innerHTML = "";
  IDS.forEach(function(id){
    var r = RESULTS[id];
    if (r === currentResult) return; // 跳过本人
    var item = document.createElement("div");
    item.className = "ot-item";
    item.innerHTML =
      '<div class="ot-head">' +
        '<span class="ot-emoji">' + r.emoji + '</span>' +

/* ============ 海报生成（Canvas，无外部依赖） ============ */
var FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Helvetica Neue",sans-serif';

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, maxWidth){
  var chars = Array.from(text);
  var lines = [], line = "";
  for (var i=0; i<chars.length; i++){
    var test = line + chars[i];
    if (ctx.measureText(test).width > maxWidth && line){
      lines.push(line); line = chars[i];
    } else { line = test; }
  }
  if (line) lines.push(line);
  return lines;
}

function buildPoster(r){
  var W = 1080, H = 1440;
  var c = document.createElement("canvas");
  c.width = W; c.height = H;
  var ctx = c.getContext("2d");

  var bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, r.c1);
  bg.addColorStop(1, r.c2);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  var glow = ctx.createRadialGradient(W*0.82, 100, 20, W*0.82, 100, 280);
  glow.addColorStop(0, "rgba(255,255,255,.32)");
  glow.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "rgba(255,255,255,.42)";
  ctx.lineWidth = 3;
  roundRect(ctx, 36, 36, W-72, H-72, 28);
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.16)";
  ctx.lineWidth = 1;
  roundRect(ctx, 52, 52, W-104, H-104, 20);
  ctx.stroke();

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.font = "120px " + FONT;
  ctx.fillText(r.emoji, W/2, 240);

  ctx.fillStyle = "#ffffff";
  ctx.font = "800 76px " + FONT;
  ctx.shadowColor = "rgba(0,0,0,.25)";
  ctx.shadowBlur = 14;
  var nameLines = wrapText(ctx, r.name, W-220);
  var nameLh = 104, nameY = 380 - (nameLines.length-1)*nameLh/2;
  nameLines.forEach(function(ln, i){ ctx.fillText(ln, W/2, nameY + i*nameLh); });
  ctx.shadowBlur = 0;

  ctx.fillStyle = "rgba(255,255,255,.95)";
  ctx.font = "40px " + FONT;
  ctx.fillText(r.tag, W/2, 470);

  ctx.strokeStyle = "rgba(255,255,255,.6)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W/2-60, 540); ctx.lineTo(W/2+60, 540);
  ctx.stroke();

  var kw = r.kw;
  var gap = 18, chipH = 58, padX = 30, startY = 590;
  ctx.font = "32px " + FONT;
  var widths = kw.map(function(k){ return ctx.measureText(k).width + padX*2; });
  var total = widths.reduce(function(a,b){ return a+b; }, 0) + gap*(kw.length-1);
  var x = (W - total) / 2;
  kw.forEach(function(k, i){
    ctx.fillStyle = "rgba(255,255,255,.2)";
    roundRect(ctx, x, startY, widths[i], chipH, chipH/2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.4)";
    ctx.lineWidth = 2;
    roundRect(ctx, x, startY, widths[i], chipH, chipH/2);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.fillText(k, x + widths[i]/2, startY + chipH/2 + 2);
    x += widths[i] + gap;
  });

  var boxW = W-200, boxX = 100, boxY = 720;
  ctx.fillStyle = "rgba(0,0,0,.16)";
  roundRect(ctx, boxX, boxY, boxW, 480, 26);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.98)";
  ctx.font = "40px " + FONT;
  var lines = wrapText(ctx, r.text, boxW-110);
  var lh = 66, sy = boxY + 240 - (lines.length-1)*lh/2;
  lines.forEach(function(ln, i){ ctx.fillText(ln, W/2, sy + i*lh); });

  ctx.fillStyle = "rgba(255,255,255,.78)";
  ctx.font = "30px " + FONT;
  ctx.fillText("未来你变成嫂子 · 你俩的肌肤饥渴", W/2, H-80);

  return c;
}

/* ============ 保存 / 分享 ============ */
function saveOrShare(){
  var r = currentResult;
  var c = buildPoster(r);
  var btn = $("btn-save");
  btn.textContent = "正在生成…";
  btn.style.opacity = .7;

  c.toBlob(function(blob){
    btn.textContent = "💾 保存 / 分享结果海报";
    btn.style.opacity = 1;
    if (!blob){ toast("生成失败，请截图保存"); return; }
    var file = new File([blob], "肌肤饥渴_" + r.name + ".png", { type: "image/png" });
    var nav = navigator;
    if (nav.canShare && nav.canShare({ files: [file] })){
      nav.share({ files: [file], title: "测测你和你担的肌肤饥渴" })
        .catch(function(){ downloadBlob(blob, file.name); });
    } else {
      downloadBlob(blob, file.name);
    }
  }, "image/png");
}

function downloadBlob(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
  toast("海报已保存到相册 / 下载");
}

/* ============ 事件绑定 ============ */
$("btn-start").addEventListener("click", function(){
  cur = 0; answers = []; currentResult = null;
  renderQuestion();
  show("quiz");
});
$("btn-back").addEventListener("click", function(){
  if (cur === 0){ show("start"); }
  else { cur--; renderQuestion(); }
});
$("btn-retest").addEventListener("click", function(){
  cur = 0; answers = []; currentResult = null;
  renderQuestion();
  show("quiz");
});
$("btn-save").addEventListener("click", saveOrShare);
</script>
